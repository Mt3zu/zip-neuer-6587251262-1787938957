name: Build ZIP Web App APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build APK
        shell: bash
        run: |
          set -e
          npm install -g cordova
          cordova create noor_app com.neuer.app "neuer"
          cd noor_app
          cordova platform add android
          # Make the Android startup splash visually invisible for ZIP -> APK.
          # The ZIP project opens index.html directly after Android startup.
          mkdir -p res
          if [ -f ../.github/workflows/icon.png ]; then cp ../.github/workflows/icon.png res/icon.png; fi
          cat > res/transparent_splash.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#00000000" android:pathData="M0,0h108v108h-108z" />
          </vector>
          EOF
          cat > config.xml <<'EOF'
          <widget id="com.neuer.app" version="1.0.0" xmlns="http://www.w3.org/ns/widgets">
              <name>neuer</name>
              <description>ZIP Web App</description>
              <author>Noor AI Team</author>
              <content src="index.html" />
              <access origin="*" />
              <allow-navigation href="*" />
              <allow-intent href="http://*/*" />
              <allow-intent href="https://*/*" />
              <preference name="Orientation" value="portrait" />
              <preference name="loadUrlTimeoutValue" value="300000" />
              <preference name="SplashScreenDelay" value="0" />
              <preference name="AutoHideSplashScreen" value="true" />
              <preference name="ShowSplashScreen" value="false" />
              <preference name="AndroidWindowSplashScreenAnimatedIcon" value="res/transparent_splash.xml" />
              <preference name="AndroidWindowSplashScreenBackground" value="#00000000" />
              <preference name="AndroidWindowSplashScreenIconBackgroundColor" value="#00000000" />
              <platform name="android"><icon src="res/icon.png" /></platform>
          </widget>
          EOF
          rm -rf www/*
          cp -a ../project/. www/
          test -f www/index.html
          cordova build android --debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: neuer-App
          path: noor_app/platforms/android/app/build/outputs/apk/debug/*.apk
